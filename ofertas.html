    function loadOffers() {
        const offerList = document.getElementById('offerList');
        offers.forEach(offer => {
            const item = document.createElement('div');
            item.className = 'offer-item';
            item.innerHTML = `
                <img src="${offer.image}" alt="${offer.name}">
                <h3>${offer.name}</h3>
                <p>${offer.description}</p>
                <p><span style="text-decoration: line-through;">Q ${offer.originalPrice.toFixed(2)}</span> Q ${offer.discountPrice.toFixed(2)}</p>
            `;
            offerList.appendChild(item);
        });
    }

    function addToCart(name, price) {
        alert(`Producto ${name} agregado al carrito por Q ${price.toFixed(2)}`);
