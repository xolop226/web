    function loadInsurances() {
        const insuranceList = document.getElementById('insuranceList');
        insurances.forEach(insurance => {
            const item = document.createElement('div');
            item.className = 'insurance-item';
            item.innerHTML = `
                <img src="${insurance.image}" alt="${insurance.name}">
                <h3>${insurance.name}</h3>
                <p>${insurance.description}</p>
            `;
            insuranceList.appendChild(item);
        });
    }

    function getInfo(name) {
        alert(`Obteniendo más información sobre el ${name}`);
        // Aquí puedes implementar la lógica para mostrar más información
    }

    // Cargar los seguros al inicio
    loadInsurances();
